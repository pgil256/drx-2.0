; runtime/arduino/motor/platformio.ini
[platformio]
; The sketch lives at the project root (not src/)
src_dir = .
test_dir = ../../../development/tests/firmware

[env:native]
platform = native
test_framework = unity
build_flags = -DUNIT_TEST -std=c++11
; Tests include motor.ino themselves; build no sources directly
build_src_filter = -<*>

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
; Everything at the root (an explicit +<motor.ino> filter matched nothing
; after PlatformIO's ino conversion). The native tests live outside this
; directory, under test_dir.
build_src_filter = +<*>
lib_deps =
    pfeerick/elapsedMillis@^1.0.6
