# Lint configuration (CI: "Lint" job; locally: `ruff check .`).
#
# Deliberately small. The Raspberry Pi runs Buster's Python 3.7, while the
# tests and CI run a current Python, so the most useful thing a linter can do
# here is refuse syntax the Pi cannot parse.
target-version = "py37"

extend-exclude = [
    ".cache",
    ".claude",
    "development/backups",
    "development/reference",
    "devices/archive",
    "devices/profiles",
]

[lint]
select = [
    "E9",     # syntax errors, including syntax newer than target-version
    "F",      # pyflakes: undefined names, unused imports and variables
    "FA102",  # `X | None` / `list[int]` annotations that fail on Python 3.7
    "BLE001", # `except Exception` that neither re-raises nor logger.exception()s
    "S110",   # `try`/`except`/`pass`
]

# Files not yet converted to the blind-except rules (checklist L2). Remove a
# file's entry in the commit that converts it. A catch-all that is truly
# needed stays, with `# noqa: BLE001 - <reason>`.
[lint.per-file-ignores]
"devices/maintenance/raspberry-pi/version-chooser/version_chooser.py" = ["BLE001", "S110"]
