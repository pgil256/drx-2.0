name: CI

# De-duplicated triggers: pushes to main, every PR, and manual runs.
# (Previously fired on both `push` and `pull_request` for every commit.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for PyQt5 (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            xvfb

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a python -m pytest -q

  # Hermetic: system g++ + the vendored Unity framework in test/unity/,
  # no PlatformIO registry access needed. Gates the PR (no continue-on-error).
  firmware-native-tests:
    name: Firmware native tests (g++ + Unity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run firmware test suites
        run: bash main/motor/run_native_tests.sh

  firmware-avr-build:
    name: Firmware AVR build check (Mega 2560)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('main/motor/platformio.ini') }}

      - name: Compile firmware for target hardware
        working-directory: main/motor
        run: pio run -e mega
