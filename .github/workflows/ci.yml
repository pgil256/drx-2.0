name: CI

# De-duplicated triggers: pushes to the long-lived branches, every PR, and
# manual runs. (Previously fired on both `push` and `pull_request` for every
# commit.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: no job here pushes, comments or publishes releases.
permissions:
  contents: read

# A new push to a PR supersedes the run in progress; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Python tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: development/requirements-test.txt

      - name: Install system libraries for PyQt5 (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            rsync \
            xvfb

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r development/requirements-test.txt

      # H7: host clamps (constants.py) and firmware clamps (motor.ino)
      # declare the same limits twice; fail fast if they drift.
      - name: Check host/firmware safety-limit sync
        run: python development/scripts/check_limits_sync.py

      # On Linux the pty-based integration tests run for real
      # (they skip on Windows dev machines). Coverage of the shipped app is
      # measured here only; there is no threshold yet.
      - name: Run pytest with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a python -m pytest -q \
            --cov=runtime/raspberry-pi/main \
            --cov-config=development/coverage.ini \
            --cov-report=xml

      - name: Report coverage total
        if: ${{ !cancelled() }}
        run: |
          total="$(python -m coverage report --rcfile=development/coverage.ini --format=total)"
          echo "Line coverage of runtime/raspberry-pi/main: ${total}%"
          echo "Line coverage of \`runtime/raspberry-pi/main\`: **${total}%**" >> "$GITHUB_STEP_SUMMARY"

      # coverage.ini writes the XML under .cache/, which upload-artifact
      # treats as hidden.
      - name: Upload coverage XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ github.sha }}
          path: .cache/coverage/coverage.xml
          include-hidden-files: true
          if-no-files-found: error

  # Rules live in ruff.toml. The Pi runs Python 3.7 while the tests above run
  # 3.12, so this is the step that rejects syntax the device cannot parse.
  lint:
    name: Lint (ruff, Python 3.7 syntax)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run ruff
        run: |
          python -m pip install ruff==0.15.13
          ruff check .

  # Every tracked shell script. Gates on warnings and errors; info-level notes
  # (SC2086/SC2029 on the intentionally word-split $SSH_OPTS in the sync
  # scripts) are printed by `shellcheck -S style` locally but do not fail CI.
  shellcheck:
    name: Shell scripts (shellcheck)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run shellcheck
        run: |
          python -m pip install shellcheck-py==0.11.0.1
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

  # A real Python 3.7 (the Pi's interpreter) byte-compiles the shipped code and
  # imports every runtime module. Gates the PR.
  python37-imports:
    name: Python 3.7 import check (Pi runtime)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container: python:3.7-slim-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries for PyQt5 (headless)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1

      # RPi.GPIO and python-vlc are stubbed by the script; the rest match the
      # pins in runtime/raspberry-pi/main/requirements.txt.
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          # PyQt5 5.15.9 is the last release whose PyQt5-sip range (12.11 to
          # 12.12) still ships Python 3.7 wheels; 5.15.10 needs sip 12.13+,
          # which has no 3.7 wheel and fails to build without gcc.
          pip install "PyQt5==5.15.9" "PyQt5-sip==12.12.2" pyserial==3.5 python-dotenv==0.21.1 qrcode==7.4.2

      - name: Byte-compile shipped Python
        run: python -m compileall -q runtime/raspberry-pi/main devices/maintenance

      - name: Import every runtime module
        env:
          QT_QPA_PLATFORM: offscreen
        run: python development/scripts/check_runtime_imports.py

  # The same suite as python-tests, on the Pi's interpreter. Catches standard
  # library calls that exist on 3.12 but not on 3.7, which the import check
  # cannot see because they only fail when the line runs. Gates the PR.
  python37-tests:
    name: Python 3.7 tests (Pi interpreter)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: python:3.7-slim-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libraries for PyQt5 (headless)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libfontconfig1 \
            rsync

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r development/requirements-test.txt

      # The container runs as root, and the firmware flash script refuses root
      # by design, so the suite runs as an ordinary user like the 3.12 job.
      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          useradd --create-home tester
          chown -R tester .
          runuser -u tester -- python -m pytest -q

  # Hermetic: system g++ + the vendored Unity framework in
  # development/tests/firmware/unity/,
  # no PlatformIO registry access needed. Gates the PR (no continue-on-error).
  firmware-native-tests:
    name: Firmware native tests (g++ + Unity)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run firmware test suites
        run: bash development/tests/firmware/run_native_tests.sh

  firmware-avr-build:
    name: Firmware AVR build check (Mega 2560)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          # Same PlatformIO Core the Pi maintenance script installs (update_buster.py).
          pip install platformio==6.1.19

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('runtime/arduino/motor/platformio.ini') }}

      # Flash and RAM use against the Mega 2560's limits, for review in the log.
      # Runs before the compile step: the size target rebuilds the environment
      # without producing firmware.hex, so the default build must come last.
      - name: Report firmware size
        working-directory: runtime/arduino/motor
        run: pio run -e mega -t size

      - name: Compile firmware for target hardware
        working-directory: runtime/arduino/motor
        run: pio run -e mega

      - name: Checksum firmware image
        working-directory: runtime/arduino/motor/.pio/build/mega
        run: |
          sha256sum firmware.hex > firmware.hex.sha256
          cat firmware.hex.sha256

      # .pio/ is a hidden directory, which upload-artifact skips by default.
      - name: Upload firmware image
        uses: actions/upload-artifact@v4
        with:
          name: firmware-mega-${{ github.sha }}
          path: |
            runtime/arduino/motor/.pio/build/mega/firmware.hex
            runtime/arduino/motor/.pio/build/mega/firmware.hex.sha256
          include-hidden-files: true
          if-no-files-found: error
