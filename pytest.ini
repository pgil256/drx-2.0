[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests that test a single component in isolation
    integration: Integration tests that test multiple components together
    arduino: Tests related to Arduino communication
    protocol: Tests related to protocol execution
    actuator: Tests related to actuator control
    ui: Tests related to the user interface

addopts = -v

log_cli = True
log_cli_level = INFO