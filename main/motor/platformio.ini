; main/motor/platformio.ini
[platformio]
; The sketch lives at the project root (not src/)
src_dir = .

[env:native]
platform = native
test_framework = unity
build_flags = -DUNIT_TEST -std=c++11
; Tests include motor.ino themselves; build no sources directly
build_src_filter = -<*>

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
test_framework = unity
; Only the sketch -- exclude test/ from the hardware build
build_src_filter = +<motor.ino>
lib_deps =
    bogde/HX711@^0.7.5
    pfeerick/elapsedMillis@^1.0.6
