[system]
# System settings
debug_mode = true
log_level = INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
backup_enabled = true
backup_interval = 24  # hours

[ui]
# User interface settings
fullscreen = true
theme = default
hour_format = 24  # 12 or 24
language = en

[hardware]
# Hardware configuration
arduino_port = /dev/ttyACM0 # For Windows use COM3, etc.
arduino_baud_rate = 115200
gpio_enabled = true

[protocols]
# Protocol settings
default_cycles = 10
max_pressure = 100  # pounds
min_pressure = 0    # pounds
pressure_increment = 5

[safety]
# Safety limits
max_temperature = 50  # Celsius
emergency_stop_enabled = true
movement_timeout = 30  # seconds

[data]
# Data management
auto_save = true
save_interval = 5   # minutes
max_log_size = 10   # MB
data_retention = 90 # days

[network]
# Network settings
remote_backup = false
backup_server = 
backup_user = 
backup_path = 

[logging]
# Logging configuration
remote_logging = false 
remote_log_host = 100.92.6.63  # Your Tailscale IP
remote_log_port = 5140

